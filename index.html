<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .toggle-link a {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Форма Регистрации -->
        <div id="register-form">
            <h2>Регистрация</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="name" required placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" name="lastName" required placeholder="Иванов">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" name="phoneNumber" placeholder="+79990000000">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
                </div>
                <button type="submit" id="reg-btn">Зарегистрироваться</button>
            </form>
            <div class="toggle-link">
                Уже есть аккаунт? <a onclick="toggleForms()">Войти</a>
            </div>
        </div>

        <!-- Форма Входа -->
        <div id="login-form" class="hidden">
            <h2>Вход</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required placeholder="******">
                </div>
                <button type="submit" id="login-btn">Войти</button>
            </form>
            <div class="toggle-link">
                Нет аккаунта? <a onclick="toggleForms()">Зарегистрироваться</a>
            </div>
        </div>

        <div id="message-box" class="message"></div>
    </div>

    <script>
        // Порт 5000, как указано в твоем app.js
        const API_URL = 'http://localhost:5000'; 

        const registerForm = document.getElementById('register-form');
        const loginForm = document.getElementById('login-form');
        const messageBox = document.getElementById('message-box');

        function toggleForms() {
            registerForm.classList.toggle('hidden');
            loginForm.classList.toggle('hidden');
            messageBox.textContent = '';
            messageBox.className = 'message';
        }

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = 'message ' + type;
        }

        // --- ЛОГИКА РЕГИСТРАЦИИ ---
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const form = e.target;
            
            btn.disabled = true;
            btn.textContent = "Загрузка...";

            const data = {
                name: form.name.value,
                lastName: form.lastName.value,
                phoneNumber: form.phoneNumber.value,
                email: form.email.value,
                password: form.password.value
            };

            try {
                // Путь совпадает с routeUser.post("/registration" ...)
                const response = await fetch(`${API_URL}/registration`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(result, "success"); // "Регистрация прошла успешно"
                    form.reset();
                    setTimeout(() => {
                        toggleForms(); // Переключаем на вход
                        showMessage("Теперь войдите в систему", "success");
                    }, 1500);
                } else {
                    // Если ошибка (например, такой email уже есть)
                    showMessage(result || "Ошибка регистрации", "error");
                }
            } catch (err) {
                console.error(err);
                showMessage("Нет связи с сервером", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Зарегистрироваться";
            }
        }

        // --- ЛОГИКА ВХОДА ---
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const form = e.target;

            btn.disabled = true;
            btn.textContent = "Загрузка...";

            const data = {
                email: form.email.value,
                password: form.password.value
            };

            try {
                // Путь совпадает с routeUser.post("/login" ...)
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage("Успешный вход!", "success");
                    console.log("Пользователь:", result);
                    
                    // Здесь можно сохранить данные, например:
                    // localStorage.setItem('user', JSON.stringify(result));
                    // window.location.href = '/dashboard.html'; 
                } else {
                    showMessage(result, "error"); // "Неверный логин или пароль"
                }
            } catch (err) {
                console.error(err);
                showMessage("Нет связи с сервером", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Войти";
            }
        }
    </script>
</body>
</html>
